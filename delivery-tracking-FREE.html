<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Tracking - Shreevari Snacks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- LEAFLET - 100% FREE! -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <style>
        #trackingMapContainer {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            border: 2px solid #ddd;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-black text-orange-600">🍽️ Shreevari Snacks</h1>
            <nav class="flex gap-6">
                <a href="index.html" class="text-gray-700 hover:text-orange-600">Home</a>
                <a href="profile.html" class="text-gray-700 hover:text-orange-600">Profile</a>
                <button onclick="logout()" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700">Logout</button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Live Map Section -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-8">
            <div class="bg-gradient-to-r from-orange-600 to-red-600 text-white p-6">
                <h1 class="text-3xl font-black flex items-center gap-2">
                    🚗 Live Delivery Tracking (100% FREE)
                </h1>
                <p class="text-orange-100 mt-2">Track your order in real-time - Uses OpenStreetMap</p>
            </div>
            
            <!-- Map Container -->
            <div id="trackingMapContainer"></div>
            
            <!-- Map Legend -->
            <div class="p-6 grid grid-cols-3 gap-4 border-t">
                <div class="flex items-center gap-3">
                    <div class="w-6 h-6 bg-red-600 rounded-full"></div>
                    <p class="text-gray-700">🍽️ Restaurant</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-6 h-6 bg-yellow-400 rounded-full"></div>
                    <p class="text-gray-700">🚗 Delivery Boy</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-6 h-6 bg-blue-600 rounded-full"></div>
                    <p class="text-gray-700">📍 Your Location</p>
                </div>
            </div>
        </div>

        <!-- Order Details & Status Timeline -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left: Order Details -->
            <div class="lg:col-span-2">
                <div id="trackingDetails">
                    <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                        <p class="text-gray-500 text-lg">Loading order details...</p>
                    </div>
                </div>
            </div>
            
            <!-- Right: Status Timeline -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div id="statusTimeline">
                    <p class="text-gray-500 text-center">Loading status...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="delivery-tracking-SATELLITE.js"></script>
    
    <script>
        window.addEventListener('load', () => {
            waitForFirebase(() => {
                initializeTracking();
            });
        });
    </script>

</body>
</html>
